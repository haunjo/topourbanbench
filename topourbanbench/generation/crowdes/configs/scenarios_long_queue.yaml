# Long Queue variant — maximize queue length and minimum queue size.
# Gathering is disabled (max_gathering_size: 0 acts as a signal to skip).
# All other parameters inherit from scenarios.yaml semantics.

robot_clearance_meters: 0.5
road_curb_margin_meters: 0.5

scenarios:
  queue:
    enabled: true
    description: "People forming lines and waiting"

  cohesive:
    enabled: true
    description: "Groups walking side-by-side"

  gathering:
    enabled: false
    description: "Disabled for long_queue mode"

  crosswalk:
    enabled: false
    description: "Groups crossing from both sides of a crosswalk (EXCLUDED FROM BENCHMARK)"

queue:
  detection_mode: "bus_stop"
  line_thickness_meters: 0.6
  queue_length_meters: 20.0
  queue_length_meters_min: 10.0

  spacing_meters_min: 0.9
  spacing_meters_max: 1.5
  max_queue_size: 7
  max_queue_size_min: 5
  min_bypass_meters: 3.0

  safety_margin_ratio: 0.9
  min_length_meters: 2.0
  max_length_meters: 20.0
  scan_gap_tolerance_meters: 0.2

cohesive:
  proximity_threshold: 80.0
  goal_similarity_threshold: 0.5
  temporal_threshold: 3.0
  speed_variance_threshold: 15.0
  min_group_size: 2
  max_group_size: 3

  side_by_side_spacing_meters: 1.0
  cohesion_strength: 0.9

gathering:
  search_radius_meters: 2.5
  min_coverage_ratio: 0.6
  max_gathering_points: 0
  min_distance_meters: 6.0
  queue_overlap_clearance_meters: 5.0

  min_gathering_size: 3
  max_gathering_size: 0
  spacing_meters_min: 1.0
  spacing_meters_max: 2.0
  spacing_meters: 1.5

  min_radius_meters: 1.0
  max_radius_meters: 2.5
  safety_margin_ratio: 0.6

semantic_ids:
  road: 1
  sidewalk: 2
  roadline: 24
  building: 3
  overhang_ids: [0, 5, 6, 7, 8, 22]
  vegetation: 9
  fence: 5

walkable_connectivity:
  mode: largest_only
  min_component_area: 1000

appearance:
  border_thickness: 45
  probability_smoothing_sigma: 15
  flow_direction: auto
  flow_length_ratio: 1.0
