# Dense Mixed variant — small gatherings + mid-size queues + larger cohesive groups.
#
# Target sizes:
#   gathering: 3~4 agents, tight radius (1.0~2.0 m)
#   queue:     4~6 agents, moderate length
#   cohesive:  3~4 agents (larger than default 2~3)
#
# Both queue and gathering enabled simultaneously → mixed interaction challenge.

robot_clearance_meters: 0.5
road_curb_margin_meters: 0.5

scenarios:
  queue:
    enabled: true
    description: "People forming lines and waiting"

  cohesive:
    enabled: true
    description: "Groups walking side-by-side"

  gathering:
    enabled: true
    description: "Small gatherings (3~4 agents)"

  crosswalk:
    enabled: false
    description: "EXCLUDED FROM BENCHMARK"

queue:
  detection_mode: "bus_stop"
  line_thickness_meters: 0.6
  queue_length_meters: 12.0
  queue_length_meters_min: 5.0

  spacing_meters_min: 1.0
  spacing_meters_max: 1.6
  max_queue_size: 6            # cap at 6 → 4~6 agent queues
  max_queue_size_min: 4        # minimum of the max → at least 4 agents
  min_bypass_meters: 2.5

  safety_margin_ratio: 0.85
  min_length_meters: 2.0
  max_length_meters: 10.0
  scan_gap_tolerance_meters: 0.2

cohesive:
  proximity_threshold: 80.0
  goal_similarity_threshold: 0.5
  temporal_threshold: 3.0
  speed_variance_threshold: 15.0
  min_group_size: 3            # larger than default (2) → 3~4 agent groups
  max_group_size: 4

  side_by_side_spacing_meters: 1.0
  cohesion_strength: 0.9

gathering:
  search_radius_meters: 2.0   # smaller than large_gathering (4.5) → tighter spots
  min_coverage_ratio: 0.55
  max_gathering_points: 4
  min_distance_meters: 6.0
  queue_overlap_clearance_meters: 6.0

  min_gathering_size: 3
  max_gathering_size: 4        # cap at 4 → small gatherings
  spacing_meters_min: 0.8
  spacing_meters_max: 1.4
  spacing_meters: 1.1

  min_radius_meters: 0.6
  max_radius_meters: 1.3       # tighter radius → more compact
  safety_margin_ratio: 0.6

semantic_ids:
  road: 1
  sidewalk: 2
  roadline: 24
  building: 3
  overhang_ids: [0, 5, 6, 7, 8, 22]
  vegetation: 9
  fence: 5

walkable_connectivity:
  mode: largest_only
  min_component_area: 1000

appearance:
  border_thickness: 45
  probability_smoothing_sigma: 15
  flow_direction: auto
  flow_length_ratio: 1.0
